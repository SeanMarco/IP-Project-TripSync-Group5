<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TripSync — Sign Up</title>
<link rel="stylesheet" href="style/styles.css">
</head>
<body>
<div class="shell">
  <div class="auth-hero">
    <div class="mark">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5 5-2z"/></svg>
    </div>
    <h1>Plan together,<br>explore forever.</h1>
    <p>Coordinate itineraries, split expenses, and share memory boards with your travel crew.</p>
  </div>

  <div class="sheet">
    <div class="seg">
      <a href="index.html">Sign In</a>
      <a href="signup.html" class="active">Sign Up</a>
    </div>

    <div class="list-card">
      <div class="list-row">
        <svg class="icon row-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.5 4-5.5 7-5.5s5.8 2 7 5.5"/></svg>
        <div class="list-row-body">
          <label>Full name</label>
          <input type="text" placeholder="John Doe">
        </div>
      </div>
      <div class="list-row">
        <svg class="icon row-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5L12 13l8.5-6.5"/></svg>
        <div class="list-row-body">
          <label>Email address</label>
          <input type="email" placeholder="you@tripsync.com">
        </div>
      </div>
      <div class="list-row">
        <svg class="icon row-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 018 0v3"/></svg>
        <div class="list-row-body">
          <label>Password</label>
          <input type="password" placeholder="Min. 8 characters">
        </div>
        <button class="eye" aria-label="Show password">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="2.6"/></svg>
        </button>
      </div>
      <div class="list-row">
        <svg class="icon row-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 018 0v3"/></svg>
        <div class="list-row-body">
          <label>Confirm password</label>
          <input type="password" placeholder="Repeat your password">
        </div>
        <button class="eye" aria-label="Show password">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="2.6"/></svg>
        </button>
      </div>
    </div>

    <a class="btn-primary" href="home.html">Create account</a>
    <div class="divider">or sign up with</div>
    <div class="oauth-row">
      <button class="oauth-btn">
        <svg class="icon-sm" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.26 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.85A11 11 0 0012 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 010-4.2V7.05H2.18a11 11 0 000 9.9l3.66-2.85z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1a11 11 0 00-9.82 6.05l3.66 2.85C6.71 7.3 9.14 5.38 12 5.38z"/></svg>
        Google
      </button>
      <button class="oauth-btn">
        <svg class="icon-sm" viewBox="0 0 24 24" fill="currentColor"><path d="M16.36 1.43c.08 1.02-.3 2-.9 2.7-.62.7-1.63 1.25-2.62 1.17a2.85 2.85 0 01.86-2.63c.6-.68 1.65-1.19 2.66-1.24zM20 17.1c-.5 1.14-.73 1.65-1.37 2.66-.9 1.4-2.16 3.16-3.72 3.17-1.39.02-1.75-.9-3.64-.89-1.88.01-2.28.9-3.68.88-1.56-.02-2.75-1.6-3.65-3-2.5-3.86-2.77-8.4-1.22-10.82.98-1.53 2.75-2.5 4.4-2.5 1.55 0 2.53.98 3.7.98 1.14 0 1.9-.99 3.68-.99 1.4 0 2.87.76 3.9 2.06-3.16 1.72-2.87 6.22.6 7.45z"/></svg>
        Apple
      </button>
    </div>
    <div class="fine">Already have an account? <a href="index.html">Sign in</a></div>
  </div>
</div>
</body>
</html>
