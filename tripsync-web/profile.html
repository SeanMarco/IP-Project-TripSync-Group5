<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TripSync — Profile</title>
<link rel="stylesheet" href="style/styles.css">
</head>
<body>
<div class="shell">
  <div class="navbar">
    <a class="nav-btn" href="home.html">
      <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 5L8 12l6.5 7"/></svg>
      Back
    </a>
    <span class="title">Profile</span>
    <button class="nav-icon-btn" aria-label="Share">
      <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></svg>
    </button>
  </div>
  <main>
    <div class="content-pad" style="padding-top:20px;">
      <div class="profile-card">
        <div class="avatar">JP</div>
        <h3>Joseff Paclibar</h3>
        <div class="email">vinleopacs@gmail.com</div>
        <span class="pill">Premium member</span>
        <div class="meta-list">
          <div class="meta-row"><span>Member since</span><span>Jan 2025</span></div>
          <div class="meta-row"><span>Trips hosted</span><span>12</span></div>
        </div>
      </div>

      <div class="stats-card">
        <h4>Trip statistics</h4>
        <div class="stats-grid">
          <div class="stat-box"><div class="stat-num">12</div><div class="stat-lbl">Total trips</div></div>
          <div class="stat-box"><div class="stat-num">3</div><div class="stat-lbl">Upcoming</div></div>
          <div class="stat-box"><div class="stat-num">9</div><div class="stat-lbl">Past trips</div></div>
          <div class="stat-box"><div class="stat-num">4</div><div class="stat-lbl">Collaborations</div></div>
        </div>
      </div>
    </div>
  </main>

  <div class="tabbar">
    <a class="tab" href="home.html">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
      Home
    </a>
    <a class="tab" href="#">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg>
      Article
    </a>
    <a class="tab active" href="profile.html">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.5 4-5.5 7-5.5s5.8 2 7 5.5"/></svg>
      Profile
    </a>
    <a class="tab" href="#">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.15-1.4l1.9-1.5-2-3.4-2.25.75a6.9 6.9 0 00-2.4-1.4L13.7 3h-3.4l-.4 2.05a6.9 6.9 0 00-2.4 1.4L5.25 5.7l-2 3.4 1.9 1.5a7.3 7.3 0 000 2.8l-1.9 1.5 2 3.4 2.25-.75c.7.6 1.5 1.08 2.4 1.4l.4 2.05h3.4l.4-2.05a6.9 6.9 0 002.4-1.4l2.25.75 2-3.4-1.9-1.5c.1-.46.15-.93.15-1.4z"/></svg>
      Settings
    </a>
  </div>
</div>
</body>
</html>
