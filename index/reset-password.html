<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2c93d6">
  <title>TripSync | Reset your password</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");</script>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
  <main class="page reset-page">
    <section class="auth-section">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <i class="fa-solid fa-moon"></i>
        <i class="fa-solid fa-sun"></i>
      </button>

      <div class="auth-card">
        <div class="auth-brand">
          <div class="auth-logo"><i class="fa-solid fa-key"></i></div>
          <h2>Trip<span>Sync</span></h2>
          <p id="reset-subtitle">Checking your reset link…</p>
        </div>

        <div id="form-message" class="form-message" role="status" aria-live="polite"></div>

        <form id="reset-form" class="hidden" novalidate>
          <div class="input-group">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="new-password" placeholder="New password" autocomplete="new-password" aria-label="New password" minlength="6" required>
            <button class="toggle-password" type="button" data-target="new-password" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
          </div>
          <div class="input-group">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="confirm-password" placeholder="Confirm new password" autocomplete="new-password" aria-label="Confirm new password" minlength="6" required>
            <button class="toggle-password" type="button" data-target="confirm-password" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
          </div>
          <button class="primary-button" type="submit" id="reset-submit">
            <span>Save new password</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>

        <p class="switch-prompt"><a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to login</a></p>
        <p class="copyright">© 2026 TripSync. Made for your next adventure.</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase/supabase-config.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
