<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2c93d6" />
  <title>TripSync — Itinerary</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../dashboard.css" />
  <link rel="stylesheet" href="../trips/trips.css" />
  <link rel="stylesheet" href="itinerary.css" />
</head>
<body>
  <div class="app-shell top-layout">
    <header class="top-nav">
      <div class="top-nav-inner">
        <a class="brand" href="../dashboard.html" aria-label="TripSync home"><span class="brand-mark">✦</span><span>Trip<span class="brand-light">Sync</span></span></a>
        <nav class="top-links" aria-label="Main navigation">
          <a class="top-link" href="../dashboard.html">Overview</a>
          <a class="top-link" href="../trips/trips.html">My trips <span class="nav-count" id="nav-trip-count" hidden>0</span></a>
          <a class="top-link active" href="../itinerary/itinerary.html" aria-current="page">Itinerary</a>
          <a class="top-link" href="../nearby/nearby.html">Where to go</a>
          <a class="top-link" href="../dashboard.html#destinations">Explore</a>
        </nav>
        <div class="top-actions">
          <button class="icon-button theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" type="button"><span class="moon">☾</span><span class="sun">☀</span></button>
          <span class="top-greeting">Good day, <strong id="top-name">Traveler</strong></span>
          <span class="avatar avatar-small" id="top-avatar">TS</span>
          <button class="icon-button logout-icon" id="logout-button" type="button" aria-label="Log out" title="Log out">↪</button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <section class="welcome-row">
        <div>
          <h1>Day by <span>day.</span></h1>
          <p class="trip-summary" id="trip-summary"></p>
        </div>
        <div class="itinerary-actions">
          <select class="trip-select" id="trip-select" aria-label="Choose a trip"></select>
          <button class="primary-button" id="add-item-btn" type="button"><span>＋</span> Add item</button>
        </div>
      </section>

      <section class="days" id="days"></section>
    </main>
  </div>

  <div class="modal" id="item-modal" hidden role="dialog" aria-modal="true" aria-labelledby="item-modal-title">
    <div class="modal-card">
      <div class="modal-head">
        <div><h2 id="item-modal-title">Add to itinerary</h2></div>
        <button class="modal-close" id="item-modal-close" type="button" aria-label="Close">✕</button>
      </div>
      <p class="form-error" id="item-form-error" role="alert" hidden></p>
      <form id="item-form" novalidate>
        <div class="form-grid">
          <div class="field full"><label for="item-title">What's the plan?</label><input type="text" id="item-title" placeholder="e.g. Island hopping tour" maxlength="100" required /></div>
          <div class="field"><label for="item-date">Day</label><select id="item-date" required></select></div>
          <div class="field"><label for="item-time">Time <small>(optional)</small></label><input type="time" id="item-time" /></div>
          <div class="field full"><label>Type <small>(optional)</small></label>
            <div class="tag-picker" id="tag-picker">
              <button type="button" data-tag="Flight">✈ Flight</button>
              <button type="button" data-tag="Hotel">🛏 Hotel</button>
              <button type="button" data-tag="Food">🍜 Food</button>
              <button type="button" data-tag="Activity">⛰ Activity</button>
              <button type="button" data-tag="Transport">🚌 Transport</button>
              <button type="button" data-tag="Other">✦ Other</button>
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="ghost-button" id="item-cancel" type="button">Cancel</button>
          <button class="primary-button" id="item-submit" type="submit"><span>＋</span> <b id="item-submit-label">Add item</b></button>
        </div>
      </form>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../supabase/supabase-config.js"></script>
  <script src="itinerary.js"></script>
</body>
</html>
