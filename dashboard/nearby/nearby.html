<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2c93d6" />
  <title>TripSync — Where to go</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../dashboard.css" />
  <link rel="stylesheet" href="../itinerary/itinerary.css" />
  <link rel="stylesheet" href="nearby.css" />
</head>
<body>
  <div class="app-shell top-layout">
    <header class="top-nav">
      <div class="top-nav-inner">
        <a class="brand" href="../dashboard.html" aria-label="TripSync home"><span class="brand-mark">✦</span><span>Trip<span class="brand-light">Sync</span></span></a>
        <nav class="top-links" aria-label="Main navigation">
          <a class="top-link" href="../dashboard.html">Overview</a>
          <a class="top-link" href="../trips/trips.html">My trips <span class="nav-count" id="nav-trip-count" hidden>0</span></a>
          <a class="top-link" href="../itinerary/itinerary.html">Itinerary</a>
          <a class="top-link active" href="nearby.html" aria-current="page">Where to go</a>
          <a class="top-link" href="../dashboard.html#destinations">Explore</a>
        </nav>
        <div class="top-actions">
          <button class="icon-button theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" type="button"><span class="moon">☾</span><span class="sun">☀</span></button>
          <span class="top-greeting">Good day, <strong id="top-name">Traveler</strong></span>
          <span class="avatar avatar-small" id="top-avatar">TS</span>
          <button class="icon-button logout-icon" id="logout-button" type="button" aria-label="Log out" title="Log out">↪</button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <section class="welcome-row">
        <div>
          <h1>Where to <span>go?</span></h1>
          <p class="trip-summary" id="near-summary">Places worth visiting around your stay.</p>
        </div>
        <div class="itinerary-actions">
          <select class="trip-select" id="trip-select" aria-label="Choose a trip"></select>
        </div>
      </section>

      <section class="panel stay-panel" id="stay-panel">
        <div class="stay-now">
          <span class="stay-pin" aria-hidden="true">📍</span>
          <div>
            <small>Showing places near</small>
            <strong id="origin-label">—</strong>
          </div>
        </div>
        <div class="origin-chips" id="origin-chips">
          <button type="button" data-origin="stay" id="origin-stay">🛏 My stay</button>
          <button type="button" data-origin="me">📍 My location</button>
          <button type="button" data-origin="center">🏙 City center</button>
        </div>
        <form class="stay-form" id="stay-form">
          <label for="stay-input">Where are you staying?</label>
          <div class="stay-row">
            <input type="text" id="stay-input" placeholder="Hotel name or address" maxlength="120" autocomplete="off" />
            <button class="primary-button" type="submit" id="stay-search">Find</button>
          </div>
          <div class="stay-results" id="stay-results" hidden></div>
          <button class="text-link stay-clear" id="stay-clear" type="button" hidden>Remove saved stay</button>
        </form>
      </section>

      <div class="map-box near-map" id="near-map"></div>

      <div class="near-toolbar">
        <h2 id="near-count">Places nearby</h2>
        <div class="radius-chips" id="radius-chips">
          <button type="button" data-radius="2000">2 km</button>
          <button type="button" data-radius="5000" class="active">5 km</button>
          <button type="button" data-radius="10000">10 km</button>
        </div>
      </div>
      <section class="near-grid" id="near-grid"></section>
      <p class="near-credit">Places and photos from Wikipedia · Addresses from OpenStreetMap</p>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../../supabase/supabase-config.js"></script>
  <script src="../travel-api.js"></script>
  <script src="nearby.js"></script>
</body>
</html>
